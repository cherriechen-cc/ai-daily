<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 日报 — 2026-04-20</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ============================================
       DESIGN TOKENS
    ============================================ */
    :root {
      --bg: #0f0f0f;
      --bg-2: #161616;
      --bg-3: #1c1c1c;
      --bg-4: #242424;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.18);
      --glow: rgba(99, 179, 237, 0.15);
      --text-primary: #f0ede8;
      --text-secondary: #a09a92;
      --text-tertiary: #635e58;
      --accent: #63b3ed;
      --accent-dim: rgba(99,179,237,0.12);
      --green: #56d364;
      --yellow: #e3b341;
      --purple: #bc8cff;
      --font: 'Geist', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
    }

    /* ============================================
       RESET & BASE
    ============================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; overflow-x: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      max-width: 100vw;
    }
    a { color: inherit; text-decoration: none; }

    /* ============================================
       LAYOUT
    ============================================ */
    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      box-sizing: border-box;
    }

    /* ============================================
       HEADER
    ============================================ */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 32px 0 24px;
      position: sticky;
      top: 0;
      background: rgba(15,15,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0ede8 0%, #a09a92 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-issue {
      font-size: 13px;
      color: var(--text-tertiary);
      font-weight: 400;
    }
    .header-date {
      text-align: right;
    }
    .date-main {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .date-weekday {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    /* Archive bar */
    .archive-bar {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .arch-label {
      font-size: 11px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
      margin-right: 4px;
    }
    .arch-link {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      transition: all 150ms var(--ease-spring);
    }
    .arch-link:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .arch-current {
      font-size: 12px;
      color: var(--accent);
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--accent);
      background: var(--accent-dim);
    }

    /* ============================================
       MAIN CONTENT
    ============================================ */
    main {
      padding: 48px 0 64px;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    /* ============================================
       SECTION
    ============================================ */
    section.section {
      margin-bottom: 48px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-icon {
      font-size: 20px;
      line-height: 1;
    }
    .section-title h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .section-badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      background: var(--bg-3);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 100px;
    }
    .section-sub {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .section-desc {
      margin-bottom: 20px;
      margin-top: -8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .section-type-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 100px;
      letter-spacing: 0.04em;
    }
    .tag-tool { background: rgba(99,179,237,0.15); color: #63b3ed; border: 1px solid rgba(99,179,237,0.3); }
    .tag-paper { background: rgba(188,140,255,0.15); color: #bc8cff; border: 1px solid rgba(188,140,255,0.3); }
    .tag-news { background: rgba(86,211,100,0.12); color: #56d364; border: 1px solid rgba(86,211,100,0.25); }
    .tag-internal { background: rgba(246,201,14,0.12); color: #e3b341; border: 1px solid rgba(246,201,14,0.25); }
    .section-desc-text {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ============================================
       GITHUB CARDS GRID
    ============================================ */
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .repo-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: transform 150ms var(--ease-spring),
                  border-color 150ms var(--ease-spring),
                  box-shadow 150ms var(--ease-spring),
                  background 150ms var(--ease-spring);
      cursor: pointer;
    }
    .repo-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 0 0 1px var(--border-hover), 0 8px 32px rgba(0,0,0,0.4), 0 0 20px var(--glow);
      background: var(--bg-3);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rank {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      min-width: 28px;
      font-variant-numeric: tabular-nums;
    }
    .repo-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .owner {
      color: var(--text-secondary);
      font-weight: 400;
    }
    .sep {
      color: var(--text-tertiary);
      margin: 0 1px;
    }
    .repo {
      color: var(--text-primary);
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-rec {
      font-size: 12px;
      color: #f6c90e;
      background: rgba(246, 201, 14, 0.08);
      border: 1px solid rgba(246, 201, 14, 0.2);
      border-radius: var(--radius-xs);
      padding: 5px 10px;
      line-height: 1.5;
    }
    .card-rec::before {
      content: "📌 ";
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: auto;
    }
    .lang-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stars {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .star-icon {
      color: var(--yellow);
      flex-shrink: 0;
    }
    .forks {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .stars-today {
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      background: rgba(86, 211, 100, 0.1);
      padding: 2px 7px;
      border-radius: 100px;
      border: 1px solid rgba(86, 211, 100, 0.2);
      margin-left: auto;
    }

    /* ============================================
       CITADEL LIST
    ============================================ */
    .citadel-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .citadel-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      transition: background 150ms var(--ease-spring);
      cursor: pointer;
    }
    .citadel-item:last-child {
      border-bottom: none;
    }
    .citadel-item:hover {
      background: var(--bg-3);
    }
    .ci-rank {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-tertiary);
      min-width: 24px;
      font-variant-numeric: tabular-nums;
    }
    .ci-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ci-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 150ms;
    }
    .citadel-item:hover .ci-title {
      color: var(--accent);
    }
    .ci-meta {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .ci-arrow {
      color: var(--text-tertiary);
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 150ms var(--ease-spring), transform 150ms var(--ease-spring);
    }
    .citadel-item:hover .ci-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* ============================================
       FOOTER
    ============================================ */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 24px 0 32px;
      text-align: center;
    }
    .footer-inner {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .footer-gen {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .footer-brand {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* ============================================
       PAPER CARDS GRID
    ============================================ */
    .paper-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .paper-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: transform 150ms var(--ease-spring),
                  border-color 150ms var(--ease-spring),
                  box-shadow 150ms var(--ease-spring),
                  background 150ms var(--ease-spring);
      cursor: pointer;
    }
    .paper-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 0 0 1px var(--border-hover), 0 8px 32px rgba(0,0,0,0.4), 0 0 20px var(--glow);
      background: var(--bg-3);
    }
    .paper-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.45;
      transition: color 150ms;
    }
    .paper-card:hover .paper-title {
      color: var(--accent);
    }
    .paper-summary {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }
    .paper-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: auto;
    }
    .paper-meta-item {
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .paper-upvotes {
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      background: rgba(86, 211, 100, 0.1);
      padding: 2px 7px;
      border-radius: 100px;
      border: 1px solid rgba(86, 211, 100, 0.2);
    }

    /* ============================================
       HOT PLATFORM BLOCKS
    ============================================ */
    .hot-platform-block {
      margin-bottom: 24px;
    }
    .hot-platform-block:last-child {
      margin-bottom: 0;
    }
    .hot-platform-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-left: 2px;
      letter-spacing: 0.3px;
    }

    /* ============================================
       SCROLLBAR
    ============================================ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 768px) {
      .repo-grid {
        grid-template-columns: 1fr;
      }
      .paper-grid {
        grid-template-columns: 1fr;
      }
      .container { padding: 0 16px; }
      main { padding: 32px 0 48px; }
      .section-desc { flex-wrap: wrap; }
      .card-title { font-size: 14px; word-break: break-word; }
      .card-desc { font-size: 13px; }
      pre, code { max-width: 100%; overflow-x: auto; }
    }

    /* ============================================
       TAB NAV
    ============================================ */
    .tab-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
      flex-wrap: wrap;
    }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 150ms var(--ease-spring);
      position: relative;
      bottom: -1px;
      border-radius: var(--radius-xs) var(--radius-xs) 0 0;
    }
    .tab-btn:hover {
      color: var(--text-primary);
      background: var(--bg-3);
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: var(--accent-dim);
    }
    .tab-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      background: var(--bg-4);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 100px;
    }
    .tab-btn.active .tab-count {
      color: var(--accent);
      border-color: rgba(99,179,237,0.3);
      background: rgba(99,179,237,0.1);
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    /* ============================================
       COLLAPSIBLE SECTION
    ============================================ */
    .collapsible-section {
      margin-bottom: 16px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 150ms var(--ease-spring);
    }
    .collapsible-section:hover {
      border-color: var(--border-hover);
    }
    .coll-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 150ms var(--ease-spring);
    }
    .coll-header:hover {
      background: var(--bg-3);
    }
    .coll-header .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coll-header .section-title h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .coll-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coll-toggle {
      font-size: 12px;
      color: var(--text-tertiary);
      transition: transform 200ms var(--ease-spring);
      display: inline-block;
    }
    .coll-toggle.open {
      transform: rotate(90deg);
    }
    .section-body {
      padding: 0 20px 20px;
    }
    .section-body.collapsed {
      display: none;
    }

    /* ============================================
       PLATFORM TAGS
    ============================================ */
    .platform-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 100px;
      letter-spacing: 0.04em;
    }
    .tag-36kr { background: rgba(255,90,50,0.15); color: #ff5a32; border: 1px solid rgba(255,90,50,0.3); }
    .tag-jiqizhixin { background: rgba(99,179,237,0.15); color: #63b3ed; border: 1px solid rgba(99,179,237,0.3); }
    .tag-qbitai { background: rgba(188,140,255,0.15); color: #bc8cff; border: 1px solid rgba(188,140,255,0.3); }
    .tag-bilibili { background: rgba(255,107,175,0.12); color: #ff6baf; border: 1px solid rgba(255,107,175,0.25); }
    .tag-hot { background: rgba(255,100,50,0.12); color: #ff7040; border: 1px solid rgba(255,100,50,0.25); }

    /* tab-empty placeholder */
    .tab-empty {
      color: var(--text-tertiary);
      font-size: 13px;
      text-align: center;
      padding: 48px 0;
    }

    /* ============================================
       RESPONSIVE (tab)
    ============================================ */
    @media (max-width: 768px) {
      .tab-btn { padding: 8px 12px; font-size: 13px; }
      .coll-header { padding: 14px 16px; }
      .section-body { padding: 0 16px 16px; }
    }

    /* ============================================
       TODAY'S FEATURED (精华区)
    ============================================ */
    .featured-section {
      padding: 32px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .featured-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .featured-title {
      font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
    }
    .featured-badge {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px;
      background: rgba(227,179,65,0.15); color: var(--yellow);
      border: 1px solid rgba(227,179,65,0.3);
    }
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .featured-card {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; cursor: pointer;
      transition: all 200ms var(--ease-spring);
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
    }
    .featured-card:hover {
      border-color: var(--border-hover); background: var(--bg-3);
      transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .fc-image {
      width: 100%; height: 160px; object-fit: cover; display: block;
      background: var(--bg-3);
    }
    .fc-image-placeholder {
      width: 100%; height: 160px; background: linear-gradient(135deg, var(--bg-3) 0%, var(--bg-4) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: var(--text-tertiary);
    }
    .fc-body { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .fc-source-row { display: flex; align-items: center; gap: 8px; }
    .fc-source-tag {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px;
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid rgba(99,179,237,0.25);
    }
    .fc-score {
      font-size: 10px; padding: 2px 7px; border-radius: 100px;
      background: rgba(86,211,100,0.1); color: var(--green);
      border: 1px solid rgba(86,211,100,0.2);
    }
    .fc-title {
      font-size: 15px; font-weight: 700; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .fc-summary {
      font-size: 13px; color: var(--text-secondary); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      flex: 1;
    }
    .fc-cta {
      font-size: 12px; color: var(--accent); font-weight: 600;
      display: flex; align-items: center; gap: 4px; margin-top: 4px;
    }

<script>
  function switchTab(tabId, btn) {
    // 切换按钮 active
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // 切换 pane
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    // 持久化到 sessionStorage
    try { sessionStorage.setItem('ai-daily-tab', tabId); } catch(e) {}
  }

  function toggleSection(sectionId) {
    var body = document.getElementById('body-' + sectionId);
    var toggle = document.getElementById('toggle-' + sectionId);
    if (!body) return;
    if (body.classList.contains('collapsed')) {
      body.classList.remove('collapsed');
      toggle.classList.add('open');
    } else {
      body.classList.add('collapsed');
      toggle.classList.remove('open');
    }
  }

  // 恢复上次选中的 Tab
  (function() {
    try {
      var saved = sessionStorage.getItem('ai-daily-tab');
      if (saved) {
        var btn = document.querySelector('.tab-btn[data-tab="' + saved + '"]');
        if (btn) switchTab(saved, btn);
      }
    } catch(e) {}
  })();
</script>
