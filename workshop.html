<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容工坊 — AI 日报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f; --bg-2: #161616; --bg-3: #1c1c1c; --bg-4: #242424;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.18);
      --text-primary: #f0ede8; --text-secondary: #a09a92; --text-tertiary: #635e58;
      --accent: #63b3ed; --accent-dim: rgba(99,179,237,0.12);
      --green: #56d364; --yellow: #e3b341; --purple: #bc8cff;
      --font: 'Geist', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1); --radius: 12px; --radius-sm: 8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; overflow-x: hidden; }
    body { font-family: var(--font); background: var(--bg); color: var(--text-primary);
      line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1280px; width: 100%; margin: 0 auto; padding: 0 24px; }
    .site-header {
      border-bottom: 1px solid var(--border); padding: 20px 0;
      position: sticky; top: 0;
      background: rgba(15,15,15,0.88); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); z-index: 100;
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .brand-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .header-nav { display: flex; gap: 4px; }
    .nav-link {
      font-size: 13px; font-weight: 500; padding: 6px 14px;
      border-radius: 8px; color: var(--text-secondary);
      transition: all 150ms var(--ease-spring);
    }
    .nav-link:hover { background: var(--bg-3); color: var(--text-primary); }
    .nav-link.active { background: var(--bg-3); color: var(--text-primary); }
    .workshop-hero {
      padding: 56px 0 40px;
      border-bottom: 1px solid var(--border);
    }
    .workshop-hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 10px; }
    .workshop-hero p { font-size: 15px; color: var(--text-secondary); max-width: 560px; }
    .workshop-main { padding: 40px 0 80px; }
    .create-banner {
      background: linear-gradient(135deg, rgba(99,179,237,0.08) 0%, rgba(188,140,255,0.08) 100%);
      border: 1px solid rgba(99,179,237,0.2);
      border-radius: var(--radius); padding: 24px 28px; margin-bottom: 40px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    }
    .create-banner-left h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .create-banner-left p { font-size: 13px; color: var(--text-secondary); }
    .create-hint {
      display: inline-block; background: var(--bg-3); border: 1px solid var(--border-hover);
      border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--accent); white-space: nowrap;
    }
    .article-list-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }
    .article-list-title { font-size: 16px; font-weight: 600; }
    .article-count { font-size: 12px; color: var(--text-tertiary); }
    .article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .article-card {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; cursor: pointer;
      transition: all 200ms var(--ease-spring); display: flex; flex-direction: column; gap: 10px;
    }
    .article-card:hover {
      border-color: var(--border-hover); background: var(--bg-3);
      transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .ac-source-row { display: flex; align-items: center; gap: 8px; }
    .ac-source-tag {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px;
      background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(99,179,237,0.25);
    }
    .ac-date { font-size: 11px; color: var(--text-tertiary); }
    .ac-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .ac-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .ac-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .ac-read { font-size: 12px; color: var(--accent); font-weight: 500; }
    .loading-state { text-align: center; padding: 80px 0; color: var(--text-tertiary); font-size: 14px; }
    .empty-state { text-align: center; padding: 80px 0; }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; color: var(--text-secondary); }
    @media (max-width: 768px) {
      .workshop-hero h1 { font-size: 24px; }
      .article-grid { grid-template-columns: 1fr; }
      .create-banner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <span class="brand-title">⚡ AI 日报</span>
      <nav class="header-nav">
        <a href="index.html" class="nav-link">日报</a>
        <a href="workshop.html" class="nav-link active">内容工坊</a>
      </nav>
    </div>
  </div>
</header>
<main>
  <div class="container">
    <div class="workshop-hero">
      <h1>✍️ 内容工坊</h1>
      <p>由 AI 自动精选 + 卡兹克风格深度解读。每天定时更新，读懂 AI 不费力。</p>
    </div>
    <div class="workshop-main">
      <div class="create-banner">
        <div class="create-banner-left">
          <h3>💬 想读某个话题的深度文章？</h3>
          <p>发消息给小聪明，他会为你量身定制一篇卡兹克风格的深度解读。</p>
        </div>
        <span class="create-hint">发消息：帮我写一篇关于 XXX 的文章</span>
      </div>
      <div class="article-list-header">
        <span class="article-list-title">📚 精华文章库</span>
        <span class="article-count" id="article-count">加载中…</span>
      </div>
      <div id="article-container">
        <div class="loading-state">⏳ 正在加载文章…</div>
      </div>
    </div>
  </div>
</main>
<footer style="border-top:1px solid var(--border);padding:24px 0;margin-top:40px;">
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-tertiary);">
      <span>⚡ AI 日报 · 内容工坊 — 由 OpenClaw 驱动</span>
    </div>
  </div>
</footer>
<script>
(function() {
  var SOURCE_LABELS = {
    hf_papers: '🤗 HuggingFace',
    arxiv: '📄 arXiv',
    marktechpost: '📰 MarkTechPost',
    jiqizhixin: '🤖 机器之心',
    qbitai: '⚛️ 量子位',
    '36kr': '📢 36氪'
  };
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function renderArticles(articles) {
    var container = document.getElementById('article-container');
    var countEl = document.getElementById('article-count');
    if (!articles || articles.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>暂无文章</h3><p>精华文章整理中，明天定时任务跑后自动填充。</p></div>';
      countEl.textContent = '共 0 篇';
      return;
    }
    countEl.textContent = '共 ' + articles.length + ' 篇';
    var html = '<div class="article-grid">';
    articles.forEach(function(a) {
      var srcLabel = SOURCE_LABELS[a.source] || a.source || '未知来源';
      var summary = a.summary || '';
      if (summary.length > 120) summary = summary.slice(0, 120) + '…';
      html += '<div class="article-card" onclick="location.href='articles/' + escHtml(a.slug) + '.html'">';
      html += '<div class="ac-source-row"><span class="ac-source-tag">' + srcLabel + '</span>';
      if (a.date) html += '<span class="ac-date">' + escHtml(a.date) + '</span>';
      html += '</div>';
      html += '<div class="ac-title">' + escHtml(a.title) + '</div>';
      if (summary) html += '<div class="ac-summary">' + escHtml(summary) + '</div>';
      html += '<div class="ac-footer"><span class="ac-read">阅读全文 →</span></div></div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }
  fetch('articles/index.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var articles = data.articles || [];
      articles.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
      renderArticles(articles);
    })
    .catch(function(e) {
      console.error('Failed to load articles/index.json', e);
      document.getElementById('article-container').innerHTML =
        '<div class="empty-state"><div class="empty-icon">📭</div><h3>暂无文章</h3><p>精华文章整理中，明天定时任务跑后自动填充。</p></div>';
      document.getElementById('article-count').textContent = '共 0 篇';
    });
})();
</script>
</body>
</html>
